# GitHub App registration template — use with https://github.com/settings/apps/new
# Or: gh api --method POST /app-manifests/{code}/conversions

name: SAST Advisory Triage
description: >-
  Advisory AI triage for CodeQL findings. Posts informational check-run annotations
  and PR summaries. Does not dismiss alerts or block merges.
url: https://example.com/sast-advisory
hook_attributes:
  url: https://YOUR_ALB_DNS/webhook/github
  active: true
redirect_url: https://example.com/sast-advisory/installed
setup_url: https://example.com/sast-advisory/setup
public: false
default_permissions:
  contents: read
  actions: read
  checks: write
  pull_requests: write
  metadata: read
default_events:
  - workflow_run
webhook_secret: GENERATE_A_STRONG_SECRET
request_oauth_on_install: false
